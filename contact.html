<!DOCTYPE html>
<html lang = "en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Class 16 - Step 1: the contact link -->
        <title>Contact - Mohamed Al-Koubah</title>

        <!-- Class 12 · Step 1: a typeface I chose -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <!-- Class 15 - Step 1: my third file-->
        <script src="script.js" defer> 

        </script>
    </head>

    <body>
       <!-- Class 13 - Step 2: navigation -->
         <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="progress.html">Progress</a></li>
                <!-- Class 16 - Step 1: the contact link -->
                <li><a href="contact.html" class = "current">Contact</a></li>
               <!-- Class 15 - Step 3: the theme button -->
               <li><button id="theme-toggle" type="button">Light</button></li>
            </ul>
         </nav>
        <header>
            <!-- Class 12: Step 3: an image -->
            <img src="images/me.jpg" alt="Portrait of Mohamed Al-Koubah." class="portrait">
            <!-- Lab 12 · Task 1: group the text so it stacks beside the photo -->
            <div class ="header-text">
                <!-- Lab 15 - Step 5: one more thing that reacts (dynamic greeting!) -->
                <span id="greeting"></span> 
                <h1>Contact</h1>
                <p>Questions about projects, or something else</p>
            </div>
        </header>

        <main>
            <!-- Class 16 - Step 2: a form -->
            <form id="contact-form">
                <p>
                    <label for="name">Your name</label>
                    <input id="name" name="name" type="text" required>
                </p>

                <p>
                    <label for="email">Your email</label>
                    <input id="email" name="email" type="email" required>
                </p>
               
                <p>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </p>

                <button type="submit">Send</button>
            </form>
            
         </main>
         
         <!-- Lab 12 · Task 3: two things in the footer -->
         <footer>
            <!-- Class 15 - Step 2: the year, written by JavaScript -->
            <p>© <span id="year"></span> Mohamed Al-Koubah</p>
            <!-- Lab 11 · Task 3: a link off my page -->
            <a href="https://github.com/kobadevv" target="_blank" rel="noopener">GitHub</a>
         </footer>
   </body>
</html>
